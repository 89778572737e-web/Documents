name: Trend Radar

on:
  schedule:
    - cron: "17 1 * * *"   # каждый день в 01:17 UTC (09:17 по Китаю)
  workflow_dispatch:        # кнопка ручного запуска

permissions:
  contents: write           # нужно, чтобы сохранить память о уже виденных трендах

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytrends
      - name: Запуск радара
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 Tools/trend_monitor/run.py
      - name: Сохранить память радара
        if: always()
        run: |
          if [ -n "$(git status --porcelain Knowledge_Base/_Radar)" ]; then
            git config user.name "trend-radar"
            git config user.email "noreply@github.com"
            git add Knowledge_Base/_Radar
            git commit -m "Radar: update seen trends"
            git push
          fi
